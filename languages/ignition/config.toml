name = "V8 Ignition Bytecode"
grammar = "ignition"
path_suffixes = ["ign"]
first_line_pattern = '^\[generated bytecode for function:.*<SharedFunctionInfo|^(?:0x)?[a-fA-F0-9]+: \[SharedFunctionInfo\] in OldSpace|^Start (?:SharedFunctionInfo|BytecodeArray)'
line_comments = ["// "]
block_comment = ["/*", "*/"]
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "<", end = ">", close = false, newline = false },
  { start = '"', end = '"', close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
]
